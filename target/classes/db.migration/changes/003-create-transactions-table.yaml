databaseChangeLog:
  - changeSet:
      id: create-transactions-table
      author: system
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_card_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transaction_from_card
                    references: bank_cards(id)
              - column:
                  name: to_card_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transaction_to_card
                    references: bank_cards(id)
              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: from_card_id
            referencedTableName: bank_cards
            referencedColumnNames: id
            constraintName: fk_transaction_from_card

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: to_card_id
            referencedTableName: bank_cards
            referencedColumnNames: id
            constraintName: fk_transaction_to_card

        - createIndex:
            tableName: transactions
            columns:
              - column:
                  name: from_card_id
            indexName: idx_transactions_from_card

        - createIndex:
            tableName: transactions
            columns:
              - column:
                  name: to_card_id
            indexName: idx_transactions_to_card

        - createIndex:
            tableName: transactions
            columns:
              - column:
                  name: transaction_date
            indexName: idx_transactions_date