spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:'0000'}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db.migration/db.changelog-master.yaml
    default-schema: public

  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.example.bankcards: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

jwt_secret: mySuperSecretKeyForJWTBankCardSystem2024ThatIsVeryLongAndSecure

app:
  encryption:
    secret: MyBankCardEncryptionKey123

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-login-endpoint: true